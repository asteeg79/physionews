name: PhysioNews Feed Refresh

on:
  schedule:
    # Europe/Berlin = UTC+1 (Winter) / UTC+2 (Sommer)
    # Gerade Stunden UTC 04–20 => deckt 06–22 Berlin (Winter) ab.
    # Jeder Endpoint prüft intern selbst, ob wir im Fenster sind.
    - cron: '0 4,6,8,10,12,14,16,18,20 * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Schritt 1: Quellen abrufen und neue Items in DB schreiben.
      # Klassifizierung + Maintenance laufen in separaten Endpoints,
      # damit jeder einzelne Schritt im Vercel-Function-Timeout bleibt.
      - name: 1. Fetch sources
        run: |
          curl -fsS -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 75 \
            --retry 1 --retry-delay 5 \
            https://${{ secrets.APP_DOMAIN }}/api/cron/fetch

      # Schritt 2: Klassifiziere die pending-Items in Chunks.
      # Der Endpoint verarbeitet max. 150 Items pro Aufruf und liefert
      # `remaining` zurück. Wir rufen ihn so oft auf, bis 0 (max 6×).
      - name: 2. Classify in chunks
        run: |
          for i in 1 2 3 4 5 6; do
            RESP=$(curl -fsS -X POST \
              -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
              --max-time 75 \
              --retry 1 --retry-delay 5 \
              https://${{ secrets.APP_DOMAIN }}/api/cron/classify)
            echo "Aufruf $i: $RESP"
            REMAINING=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('remaining', 0))" 2>/dev/null || echo 0)
            if [ "$REMAINING" = "0" ]; then
              echo "Keine pending-Items mehr — fertig nach $i Aufruf(en)"
              break
            fi
            echo "Noch $REMAINING pending — nochmal …"
          done

      # Schritt 3: Retention-Cleanup, lastRefreshAt setzen,
      # AI-Top-News-Auswahl.
      - name: 3. Maintenance + Top News
        run: |
          curl -fsS -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 75 \
            --retry 1 --retry-delay 5 \
            https://${{ secrets.APP_DOMAIN }}/api/cron/maintenance
