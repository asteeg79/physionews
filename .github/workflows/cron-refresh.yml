# PhysioNews — Datenpflege.
#
# Seit die Daten als JSON-Dateien im Repo liegen, läuft die komplette
# Pipeline hier statt in Vercel-Functions: abrufen, klassifizieren,
# aufräumen, Push verschicken — alles in einem Node-Prozess, danach werden
# die geänderten Dateien in `data/` committet.
#
# Der Push auf main löst den Vercel-Deploy aus; ein bis zwei Minuten
# später sind die neuen Beiträge in der App.
#
# Vorteile gegenüber den früheren Cron-Endpoints:
#   • kein 60-Sekunden-Function-Timeout, also kein Chunking-Loop im YAML
#   • kein CRON_SECRET und keine öffentlich erreichbaren Cron-Routen
#   • ein Lauf = ein nachvollziehbarer Commit
#
# Benötigte Repository-Secrets:
#   GEMINI_API_KEY    Klassifizierung und Top-News-Auswahl (optional —
#                     ohne Key bleibt es beim Keyword-Score)
#   PUSH_STORE_KEY    entschlüsselt data/push-subscriptions.enc.json
#   VAPID_SUBJECT / VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY   Web-Push

name: PhysioNews Datenpflege

on:
  schedule:
    # Europe/Berlin = UTC+1 (Winter) / UTC+2 (Sommer).
    # Gerade Stunden UTC 04–20 deckt 06–22 Berlin (Winter) ab; ob wir
    # wirklich im Fenster sind, entscheidet die Pipeline selbst anhand
    # von data/settings.json.
    - cron: '0 4,6,8,10,12,14,16,18,20 * * *'
  # Wird auch vom Refresh-Knopf in der App ausgelöst (siehe
  # src/app/api/refresh-on-demand/route.ts). Ein manueller Lauf ignoriert
  # das Refresh-Fenster.
  workflow_dispatch: {}

# Zwei gleichzeitige Läufe würden sich beim Commit in die Quere kommen.
concurrency:
  group: physionews-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # --ignore-scripts: Lifecycle-Skripte der Abhängigkeiten laufen nicht
        # mit. Lokal geprüft — Tests, Build und Pipeline funktionieren damit.
        run: npm ci --ignore-scripts

      - name: Pipeline ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUSH_STORE_KEY: ${{ secrets.PUSH_STORE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # Die Pipeline schreibt direkt ins ausgecheckte Repo, nicht über
          # die GitHub-API.
          DATA_WRITE_MODE: fs
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        # `npm run pipeline` statt `npx tsx …`: nutzt das per Lockfile
        # festgelegte tsx aus node_modules, statt zur Laufzeit eine
        # unbestimmte Version nachzuladen.
        run: npm run pipeline

      - name: Änderungen committen
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data; then
            echo "Keine Datenänderungen — nichts zu committen."
            exit 0
          fi

          git add data
          git commit -m "chore(data): automatischer Refresh $(date -u '+%Y-%m-%d %H:%M UTC')"

          # Zwischen Pipeline-Start und Push kann die App selbst etwas
          # committet haben (Einstellungen, Quellen, Push-Anmeldung).
          # Rebase holt das ab, statt den Push scheitern zu lassen.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push erfolgreich (Versuch $attempt)."
              exit 0
            fi
            echo "Push fehlgeschlagen — neuer Versuch in 5 s …"
            sleep 5
          done
          echo "::error::Push nach 3 Versuchen fehlgeschlagen."
          exit 1
