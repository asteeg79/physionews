<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="9.00" ry="9.00" fill="#75b72d"/>
  
  <!-- Bewegungs-Halo: subtiler Energie-Kreis um die Figur -->
  <circle cx="16" cy="16" r="13" stroke="#ffffff" stroke-width="0.7" fill="none" opacity="0.25"/>

  <!-- Kopf (leicht versetzt zur Andeutung der Bewegung) -->
  <circle cx="14.6" cy="6.4" r="2" fill="#ffffff"/>

  <!-- Arme strecken nach oben/außen — Sprung-/Reichen-Geste -->
  <path d="M 13.5 9 Q 8 6.5, 3 4"
        stroke="#ffffff" stroke-width="2.1" fill="none" stroke-linecap="round"/>
  <path d="M 15.5 9 Q 21 6, 27 5"
        stroke="#ffffff" stroke-width="2.1" fill="none" stroke-linecap="round"/>

  <!-- Hand-Punkte an den Enden -->
  <circle cx="3.2" cy="4.2" r="1" fill="#ffffff"/>
  <circle cx="27"  cy="5.1" r="1.05" fill="#ffffff"/>

  <!-- Gekrümmte Wirbel-Linie — folgt der Bewegung -->
  <circle cx="14.5" cy="11"   r="0.65" fill="#ffffff"/>
  <circle cx="14.8" cy="13.1" r="0.8"  fill="#ffffff"/>
  <circle cx="15.3" cy="15.2" r="0.95" fill="#ffffff"/>
  <circle cx="16"   cy="17.3" r="0.95" fill="#ffffff"/>
  <circle cx="16.7" cy="19.3" r="0.9"  fill="#ffffff"/>
  <circle cx="17.4" cy="21.2" r="0.75" fill="#ffffff"/>
  <circle cx="18"   cy="23"   r="0.6"  fill="#ffffff"/>

  <!-- Schwung-Bogen unten -->
  <path d="M 4 27 Q 17 30.8, 28 26"
        stroke="#ffffff" stroke-width="1.6"
        stroke-linecap="round" fill="none"/>
  
</svg>