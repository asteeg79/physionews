# Sicherheits-Inventar für den Security-Agenten (Phase 0). Grundlage für den
# täglichen Abgleich neuer Advisories: Was läuft wo, in welcher Version, wer patcht.
# Bei Änderungen an Runtime, Hosting oder Deploy-Weg mitpflegen.
projekt: physionews
repo: asteeg79/physionews (öffentlich)
stand: 2026-11-03

# PHP2Shell (CVE-2026-109618, CVE-2026-109619): nicht betroffen. Geprüft am
# 2026-10-28: kein composer.json, keine .php-Datei, kein Dockerfile, kein
# setup-php in den Workflows; keine Komponente läuft auf PHP.
php: keins

komponenten:
  - name: app
    pfad: src/
    runtime: { sprache: node, version: <zu klären> } # Vercel-Projekteinstellung, kein engines-Feld
    abhaengigkeiten: package-lock.json (Next.js 16.4.3, Serwist, web-push)
    hosting: { art: vercel, live_url: https://physionews.vercel.app }
    deploy: automatisch bei Push auf main (Vercel-GitHub-App); deploy.yml nur als manueller Ersatz
    runtime_patcht: Vercel
    verifikation: <zu klären> # kein Versions-Endpoint

  - name: pipeline
    pfad: scripts/pipeline/
    runtime: { sprache: node, version: 22 } # setup-node in cron-refresh.yml
    abhaengigkeiten: package-lock.json (rss-parser, cheerio, Gemini-API)
    hosting: { art: github-actions, runner: ubuntu-latest }
    deploy: cron-refresh.yml (mehrmals täglich), committet nach data/
    runtime_patcht: GitHub (Runner-Image), setup-node
    verifikation: Actions-Log

# Beobachtungen für Phase 1 (nicht in Phase 0 behoben):
# - Öffentliches Repo: Workflows mit Secrets (GEMINI_API_KEY, VAPID, VERCEL_TOKEN)
#   dürfen nie auf PRs aus Forks laufen; heute nur schedule und workflow_dispatch.
# - Die Pipeline gibt fremde Feed-Inhalte an Gemini: OWASP LLM01 und LLM05.
# - POST /api/refresh-on-demand startet die Pipeline ohne Anmeldung, nur mit
#   Rate-Limit je IP (1 je 5 Min.); Kosten der Gemini-Aufrufe im Blick behalten.
# - Node 22 ist in Wartung bis April 2027.
# - Actions sind seit 2026-11-03 auf Commit-SHA gepinnt (Renovate, #10).

# Akzeptierte Risiken (Phase 3, Stand 2026-11-03; npm audit: 4× hoch, 5× mittel, 2× niedrig):
# - zod in @serwist/build (hoch, zählt über die Kette @serwist/next und
#   @serwist/webpack-plugin viermal), dazu glob und minimatch (mittel): Serwist
#   9.5.13, die aktuelle Version, legt diese Versionen fest. @serwist/next läuft nur
#   beim Build und verarbeitet dort die eigenen Dateien, keine fremden Eingaben. Der
#   von npm vorgeschlagene Fix ist ein Downgrade auf Serwist 8. Bei jedem
#   Serwist-Release erneut prüfen.
# - deepmerge, minimatch und ts-morph im shadcn-CLI (mittel, niedrig): Die App nutzt
#   aus dem Paket nur shadcn/tailwind.css beim Build, das CLI läuft nie in Produktion.
